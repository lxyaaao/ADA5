# Parameters used for deliverables/yuntian_version (fin301). Same as the defaults in ada5_slam/pipeline.py.
# Use with: python3 -I scripts/run_offline.py <bag> <out> --config src/ada5_slam/config/fin301.yaml
process_every: 2
range_min: 0.15
range_max: 20
scan_voxel: 0.05
icp_voxel: 0.08
map_voxel: 0.05
local_map_keyframes: 30
icp_max_iter: 30
icp_gate_start: 0.6
icp_gate_end: 0.15
icp_huber: 0.05
icp_inlier_dist: 0.1
min_inlier: 0.35
max_jump_m: 0.3
max_jump_deg: 12
degenerate_eig: 0.02
strong_inlier: 0.6
prior_check_deg: 1
kf_dist: 0.25
kf_deg: 8
use_camera_prior: true
use_camera_loops: true
camera_heading_every: 2
orb_features_heading: 600
orb_features_loop: 1000
camera_ransac_px: 1.5
camera_ransac_iters: 300
loop_image_max_dt: 0.06
bow_words: 200
loop_min_gap_s: 30
loop_min_path_m: 5
loop_top_k: 3
loop_min_score: 0.25
loop_min_inliers: 20
loop_submap_half: 10
loop_min_lidar_inlier: 0.65
loop_max_rmse: 0.025
loop_max_yaw_disagreement_deg: 5
loop_max_correction_frac: 0.1
odom_sigma_xy: 0.005
odom_sigma_xy_per_m: 0.01
odom_sigma_deg: 0.1
odom_sigma_deg_per_deg: 0.01
lost_inflation: 10
loop_sigma_xy: 0.02
loop_sigma_deg: 0.3
graph_f_scale: 3
map_resolution: 0.05
map_max_free: 12
